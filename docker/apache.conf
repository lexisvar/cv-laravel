# Apache listens on Railway's $PORT (exported by docker/start.sh).
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Long cache for static assets (Vite files are content-hashed).
    <LocationMatch "^/(build|css|images)/">
        Header set Cache-Control "public, max-age=31536000"
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
